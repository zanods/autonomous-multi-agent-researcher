<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="640" height="1030" viewBox="0 0 640 1030" role="img"
     aria-label="Animated system architecture: User Query flows through Planner, Routing, Retrieval, Fact-Check, Synthesis to Final Output, with retry loop">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dotglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="624" height="1014" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- ============ EDGES (base + flowing overlay) ============ -->
  <g fill="none" stroke-linecap="round">
    <!-- A->B -->
    <path d="M320,108 L320,130" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,108 L320,130" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- B->C -->
    <path d="M320,224 L320,246" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,224 L320,246" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- C->D -->
    <path d="M262,368 C240,410 200,420 178,448" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M262,368 C240,410 200,420 178,448" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- C->E -->
    <path d="M378,368 C400,410 440,420 462,448" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M378,368 C400,410 440,420 462,448" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- D->F -->
    <path d="M185,530 C210,565 260,570 295,584" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M185,530 C210,565 260,570 295,584" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- E->F -->
    <path d="M455,530 C430,565 380,570 345,584" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M455,530 C430,565 380,570 345,584" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- F->G -->
    <path d="M320,678 L320,722" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,678 L320,722" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- G->H -->
    <path d="M320,802 L320,840" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,802 L320,840" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- RETRY LOOP: Fact-Check -> back to retrieval (orange) -->
    <path d="M195,640 C100,640 80,570 95,520 C100,500 80,495 48,491"
          stroke="#f0883e" stroke-width="2" stroke-dasharray="7 7" opacity="0.9"
          marker-end="url(#arrO)" fill="none">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- edge + floating labels -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="148" y="418" font-size="12.5" fill="#8b949e">Internal Knowledge</text>
    <text x="492" y="418" font-size="12.5" fill="#8b949e">Live Web Search</text>
    <text x="88" y="612" font-size="11" font-weight="600" fill="#f0883e">retry max 2</text>
    <text x="548" y="578" font-size="11" font-weight="600" fill="#fbbf24">! hallucination risk</text>
  </g>

  <!-- ============ NODES ============ -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- A: User Query -->
    <g>
      <rect x="200" y="30" width="240" height="78" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="30" width="240" height="78" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="62" font-size="15" font-weight="600" fill="#e6edf3">User Query</text>
      <text x="320" y="84" font-size="12" fill="#8b949e">research question</text>
    </g>

    <!-- B: Supervisor / Planner Agent -->
    <g>
      <rect x="200" y="132" width="240" height="92" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="132" width="240" height="92" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="166" font-size="15" font-weight="600" fill="#e6edf3">Supervisor /</text>
      <text x="320" y="187" font-size="15" font-weight="600" fill="#e6edf3">Planner Agent</text>
      <text x="320" y="208" font-size="12" fill="#8b949e">splits query into sub-tasks</text>
    </g>

    <!-- C: Routing Logic (diamond) -->
    <g>
      <polygon points="320,248 440,333 320,418 200,333" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="2.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="320,248 440,333 320,418 200,333" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="328" font-size="15" font-weight="600" fill="#e6edf3">Routing</text>
      <text x="320" y="349" font-size="15" font-weight="600" fill="#e6edf3">Logic</text>
    </g>

    <!-- D: Vector Store / Hybrid Retriever -->
    <g>
      <rect x="40" y="452" width="240" height="78" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="452" width="240" height="78" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="160" y="484" font-size="15" font-weight="600" fill="#e6edf3">Vector Store /</text>
      <text x="160" y="505" font-size="15" font-weight="600" fill="#e6edf3">Hybrid Retriever</text>
      <text x="160" y="523" font-size="12" fill="#8b949e">internal knowledge base</text>
    </g>

    <!-- E: Search Tools / MCP API -->
    <g>
      <rect x="360" y="452" width="240" height="78" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="360" y="452" width="240" height="78" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="480" y="484" font-size="15" font-weight="600" fill="#e6edf3">Search Tools /</text>
      <text x="480" y="505" font-size="15" font-weight="600" fill="#e6edf3">MCP API</text>
      <text x="480" y="523" font-size="12" fill="#8b949e">live web via Tavily</text>
    </g>

    <!-- F: Fact-Check & Re-Ranking Node -->
    <g>
      <rect x="200" y="586" width="240" height="92" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="586" width="240" height="92" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="620" font-size="15" font-weight="600" fill="#e6edf3">Fact-Check &amp;</text>
      <text x="320" y="641" font-size="15" font-weight="600" fill="#e6edf3">Re-Ranking Node</text>
      <text x="320" y="662" font-size="11" font-weight="600" fill="#34d399">✓/✗ hallucination checkpoint</text>
    </g>

    <!-- G: Synthesis & Report Agent -->
    <g>
      <rect x="200" y="724" width="240" height="78" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="6.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="724" width="240" height="78" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="757" font-size="15" font-weight="600" fill="#e6edf3">Synthesis &amp; Report Agent</text>
      <text x="320" y="778" font-size="12" fill="#8b949e">verified findings → report</text>
    </g>

    <!-- H: Final Structured Output -->
    <g>
      <rect x="200" y="842" width="240" height="78" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="7.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="842" width="240" height="78" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="320" y="875" font-size="15" font-weight="600" fill="#e6edf3">Final Structured Output</text>
      <text x="320" y="896" font-size="12" fill="#8b949e">markdown + verification gaps</text>
    </g>
  </g>

  <!-- ============ TRAVELING PULSES (split at routing, merge at fact-check) ============ -->
  <circle r="5" fill="#22d3ee" filter="url(#dotglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    <animateMotion dur="7s" begin="0s" repeatCount="indefinite"
      path="M320,69 L320,178 L320,333 C295,390 220,400 175,448 L160,491 C175,560 250,570 300,620 L320,632 L320,763 L320,881"/>
  </circle>
  <circle r="5" fill="#22d3ee" filter="url(#dotglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"
      path="M320,69 L320,178 L320,333 C345,390 420,400 465,448 L480,491 C465,560 390,570 340,620 L320,632 L320,763 L320,881"/>
  </circle>

  <!-- ============ LEGEND ============ -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">
    <line x1="60" y1="958" x2="104" y2="958" stroke="#22d3ee" stroke-width="3"/>
    <text x="114" y="962" text-anchor="start">Data flow</text>
    <line x1="60" y1="982" x2="104" y2="982" stroke="#f0883e" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="114" y="986" text-anchor="start">Retry — failed claims return (max 2)</text>
    <text x="330" y="962" text-anchor="start"><tspan fill="#fbbf24" font-weight="600">!</tspan> hallucination risk</text>
    <text x="330" y="986" text-anchor="start"><tspan fill="#34d399" font-weight="600">✓/✗</tspan> verification checkpoint</text>
  </g>
</svg>
