<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="640" height="1000" viewBox="0 0 640 1000" role="img"
     aria-label="Animated system architecture: User Query flows through Planner, Routing, Retrieval, Fact-Check, Synthesis to Final Output, with retry loop">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dotglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="624" height="984" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- ============ EDGES: orthogonal, sharp elbows (mermaid style) ============ -->
  <g fill="none" stroke-linecap="square">
    <!-- A->B -->
    <path d="M320,108 L320,136" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,108 L320,136" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- B->C -->
    <path d="M320,228 L320,244" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,228 L320,244" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- C->D -->
    <path d="M278,340 L278,404 L210,404 L210,450" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M278,340 L278,404 L210,404 L210,450" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- C->E -->
    <path d="M362,340 L362,404 L430,404 L430,450" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M362,340 L362,404 L430,404 L430,450" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- D->F -->
    <path d="M270,544 L270,576 L300,576 L300,604" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M270,544 L270,576 L300,576 L300,604" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- E->F -->
    <path d="M370,544 L370,576 L340,576 L340,604" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M370,544 L370,576 L340,576 L340,604" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- F->G -->
    <path d="M320,698 L320,736" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,698 L320,736" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- G->H -->
    <path d="M320,814 L320,852" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,814 L320,852" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- RETRY LOOP: Fact-Check -> back to retrieval (orange, orthogonal) -->
    <path d="M220,652 L130,652 L130,546" stroke="#f0883e" stroke-width="2"
          stroke-dasharray="7 7" opacity="0.9" marker-end="url(#arrO)" fill="none">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- edge labels (mermaid-style pills) -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="135" y="416" width="150" height="22" rx="11" fill="#30363d"/>
    <text x="210" y="431" font-size="12" fill="#e6edf3">Internal Knowledge</text>
    <rect x="355" y="416" width="150" height="22" rx="11" fill="#30363d"/>
    <text x="430" y="431" font-size="12" fill="#e6edf3">Live Web Search</text>
    <text x="175" y="640" font-size="11" font-weight="600" fill="#f0883e">retry max 2</text>
    <text x="470" y="378" font-size="11" font-weight="600" fill="#fbbf24">! hallucination risk</text>
  </g>

  <!-- ============ NODES ============ -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- A: User Query -->
    <g>
      <rect x="220" y="30" width="200" height="78" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="30" width="200" height="78" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="62" font-size="15" font-weight="600" fill="#e6edf3">User Query</text>
      <text x="320" y="84" font-size="12" fill="#8b949e">research question</text>
    </g>

    <!-- B: Supervisor / Planner Agent -->
    <g>
      <rect x="220" y="136" width="200" height="92" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="136" width="200" height="92" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="168" font-size="15" font-weight="600" fill="#e6edf3">Supervisor /</text>
      <text x="320" y="189" font-size="15" font-weight="600" fill="#e6edf3">Planner Agent</text>
      <text x="320" y="210" font-size="12" fill="#8b949e">splits query into sub-tasks</text>
    </g>

    <!-- C: Routing Logic (diamond) -->
    <g>
      <polygon points="320,244 404,308 320,372 236,308" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="2.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="320,244 404,308 320,372 236,308" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="313" font-size="15" font-weight="600" fill="#e6edf3">Routing Logic</text>
      <!-- decision ripple -->
      <ellipse cx="320" cy="308" rx="30" ry="18" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0">
        <animate attributeName="rx" values="30;95" dur="10s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="18;60" dur="10s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.15;0.35" dur="10s" begin="2.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- D: Vector Store / Hybrid Retriever -->
    <g>
      <rect x="110" y="452" width="200" height="92" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="110" y="452" width="200" height="92" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="210" y="484" font-size="15" font-weight="600" fill="#e6edf3">Vector Store /</text>
      <text x="210" y="505" font-size="15" font-weight="600" fill="#e6edf3">Hybrid Retriever</text>
      <text x="210" y="526" font-size="12" fill="#8b949e">internal knowledge base</text>
    </g>

    <!-- E: Search Tools / MCP API -->
    <g>
      <rect x="330" y="452" width="200" height="92" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="330" y="452" width="200" height="92" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="430" y="484" font-size="15" font-weight="600" fill="#e6edf3">Search Tools /</text>
      <text x="430" y="505" font-size="15" font-weight="600" fill="#e6edf3">MCP API</text>
      <text x="430" y="526" font-size="12" fill="#8b949e">live web via Tavily</text>
    </g>

    <!-- F: Fact-Check & Re-Ranking Node -->
    <g>
      <rect x="220" y="606" width="200" height="92" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="606" width="200" height="92" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="638" font-size="15" font-weight="600" fill="#e6edf3">Fact-Check &amp;</text>
      <text x="320" y="659" font-size="15" font-weight="600" fill="#e6edf3">Re-Ranking Node</text>
      <text x="320" y="680" font-size="11" font-weight="600" fill="#34d399">✓/✗ hallucination checkpoint</text>
    </g>

    <!-- G: Synthesis & Report Agent -->
    <g>
      <rect x="220" y="736" width="200" height="78" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="6.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="736" width="200" height="78" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="768" font-size="15" font-weight="600" fill="#e6edf3">Synthesis &amp; Report Agent</text>
      <text x="320" y="789" font-size="12" fill="#8b949e">verified findings → report</text>
    </g>

    <!-- H: Final Structured Output -->
    <g>
      <rect x="220" y="852" width="200" height="78" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="7.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="220" y="852" width="200" height="78" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="320" y="884" font-size="15" font-weight="600" fill="#e6edf3">Final Structured Output</text>
      <text x="320" y="905" font-size="12" fill="#8b949e">markdown + verification gaps</text>
      <!-- completion ripples -->
      <circle cx="320" cy="891" r="10" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
        <animate attributeName="r" values="10;75" dur="10s" begin="7.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.12;0.3" dur="10s" begin="7.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="891" r="10" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
        <animate attributeName="r" values="10;75" dur="10s" begin="8.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.12;0.3" dur="10s" begin="8.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ============ TRAVELING PULSES (split at routing, merge at fact-check) ============ -->
  <circle r="5" fill="#22d3ee" filter="url(#dotglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    <animateMotion dur="8s" begin="0s" repeatCount="indefinite"
      path="M320,69 L320,136 L320,182 L320,228 L320,244 L320,308 L278,340 L278,404 L210,404 L210,450 L210,498 L210,544 L270,544 L270,576 L300,576 L300,604 L320,652 L320,698 L320,736 L320,775 L320,814 L320,852 L320,891"/>
  </circle>
  <circle r="5" fill="#22d3ee" filter="url(#dotglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="8s" begin="4s" repeatCount="indefinite"/>
    <animateMotion dur="8s" begin="4s" repeatCount="indefinite"
      path="M320,69 L320,136 L320,182 L320,228 L320,244 L320,308 L362,340 L362,404 L430,404 L430,450 L430,498 L430,544 L370,544 L370,576 L340,576 L340,604 L320,652 L320,698 L320,736 L320,775 L320,814 L320,852 L320,891"/>
  </circle>

  <!-- ============ LEGEND ============ -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">
    <line x1="60" y1="958" x2="104" y2="958" stroke="#22d3ee" stroke-width="3"/>
    <text x="114" y="962" text-anchor="start">Data flow</text>
    <line x1="60" y1="982" x2="104" y2="982" stroke="#f0883e" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="114" y="986" text-anchor="start">Retry — failed claims return (max 2)</text>
    <text x="360" y="962" text-anchor="start"><tspan fill="#fbbf24" font-weight="600">!</tspan> hallucination risk</text>
    <text x="360" y="986" text-anchor="start"><tspan fill="#34d399" font-weight="600">✓/✗</tspan> verification checkpoint</text>
  </g>
</svg>
