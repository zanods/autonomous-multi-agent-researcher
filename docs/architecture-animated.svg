<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="640" height="920" viewBox="0 0 640 920" role="img"
     aria-label="Animated system architecture: User Query flows through Planner, Routing, Retrieval, Fact-Check, Synthesis to Final Output">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dotglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="624" height="904" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- ============ EDGES (base + flowing overlay) ============ -->
  <g fill="none" stroke-linecap="round">
    <!-- A->B -->
    <path d="M320,82 L320,142" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,82 L320,142" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- B->C -->
    <path d="M320,202 L320,230" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,202 L320,230" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- C->D -->
    <path d="M268,338 C250,372 210,384 186,408" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M268,338 C250,372 210,384 186,408" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- C->E -->
    <path d="M372,338 C390,372 430,384 454,408" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M372,338 C390,372 430,384 454,408" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- D->F -->
    <path d="M196,470 C220,512 260,520 296,548" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M196,470 C220,512 260,520 296,548" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- E->F -->
    <path d="M444,470 C420,512 380,520 344,548" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M444,470 C420,512 380,520 344,548" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- F->G -->
    <path d="M320,610 L320,670" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,610 L320,670" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- RETRY LOOP: Fact-Check -> back to retrieval (orange) -->
    <path d="M205,596 C105,596 88,520 100,470 C104,452 90,444 64,442"
          stroke="#f0883e" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"
          marker-end="url(#arrO)" fill="none">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <!-- G->H -->
    <path d="M320,730 L320,790" stroke="#484f58" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M320,730 L320,790" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 15" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- edge labels -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle">
    <text x="148" y="356">Internal Knowledge</text>
    <text x="492" y="356">Live Web Search</text>
    <text x="82" y="532" fill="#f0883e">retry (max 2)</text>
  </g>

  <!-- ============ NODES ============ -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600"
     fill="#e6edf3" text-anchor="middle">

    <!-- A: User Query -->
    <g>
      <rect x="210" y="24" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="210" y="24" width="220" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="60">User Query</text>
    </g>

    <!-- B: Supervisor / Planner Agent -->
    <g>
      <rect x="210" y="144" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="210" y="144" width="220" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="168">Supervisor /</text>
      <text x="320" y="189">Planner Agent</text>
    </g>

    <!-- C: Routing Logic (diamond) -->
    <g>
      <polygon points="320,232 428,302 320,372 212,302" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="2.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="320,232 428,302 320,372 212,302" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="297">Routing</text>
      <text x="320" y="318">Logic</text>
    </g>

    <!-- D: Vector Store / Hybrid Retriever -->
    <g>
      <rect x="60" y="412" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="412" width="220" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="170" y="436">Vector Store /</text>
      <text x="170" y="457">Hybrid Retriever</text>
    </g>

    <!-- E: Search Tools / MCP API -->
    <g>
      <rect x="360" y="412" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="360" y="412" width="220" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="470" y="436">Search Tools /</text>
      <text x="470" y="457">MCP API</text>
    </g>

    <!-- F: Fact-Check & Re-Ranking Node -->
    <g>
      <rect x="210" y="552" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="210" y="552" width="220" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="576">Fact-Check &amp;</text>
      <text x="320" y="597">Re-Ranking Node</text>
    </g>

    <!-- G: Synthesis & Report Agent -->
    <g>
      <rect x="210" y="672" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="6.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="210" y="672" width="220" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="320" y="696">Synthesis &amp;</text>
      <text x="320" y="717">Report Agent</text>
    </g>

    <!-- H: Final Structured Output -->
    <g>
      <rect x="210" y="792" width="220" height="58" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#soft)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.24;1" dur="10s" begin="7.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="210" y="792" width="220" height="58" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="320" y="816">Final Structured</text>
      <text x="320" y="837">Output</text>
    </g>
  </g>

  <!-- ============ TRAVELING PULSES ============ -->
  <circle r="5" fill="#22d3ee" filter="url(#dotglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    <animateMotion dur="7s" begin="0s" repeatCount="indefinite"
      path="M320,53 L320,173 L320,302 C300,350 230,360 185,408 L170,441 C185,510 250,520 305,575 L320,581 L320,701 L320,821"/>
  </circle>
  <circle r="5" fill="#22d3ee" filter="url(#dotglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"
      path="M320,53 L320,173 L320,302 C340,350 410,360 455,408 L470,441 C455,510 390,520 335,575 L320,581 L320,701 L320,821"/>
  </circle>
</svg>
